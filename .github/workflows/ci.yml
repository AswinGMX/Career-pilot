name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: career_pilot
          POSTGRES_USER: career_pilot
          POSTGRES_PASSWORD: career_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career_pilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://career_pilot:career_pilot@127.0.0.1:5432/career_pilot
      REDIS_URL: redis://127.0.0.1:6379
      STORAGE_DRIVER: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Legacy Boundary Guard
        if: github.event_name == 'pull_request'
        run: sh scripts/check-legacy-boundary.sh origin/${{ github.base_ref }}

      - name: Generate Prisma client
        run: pnpm --filter @career-pilot/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @career-pilot/api exec prisma migrate deploy

      - name: Seed program
        run: pnpm --filter @career-pilot/api seed:program

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
